name: Quality & Go-Live Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Lint, Math, Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Scan (NPM Audit)
        run: npm audit --audit-level=high

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Verify Mathematical & Mortality Consistency
        run: npm run test:math

      - name: Build Application & Widgets
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            public/
          retention-days: 7

  e2e-certification:
    name: E2E Playwright Certification (80 Tests)
    needs: quality-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E Certification Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse-ci-gate:
    name: Lighthouse Go-Live CI Gate (Perf >= 95, 100s)
    needs: quality-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      - name: Install Chromium for Lighthouse Audit
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse Go-Live Audit
        run: npm run test:lighthouse
        env:
          CI: true

      - name: Upload Lighthouse Report HTML & JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-report
          path: |
            docs/test-results/lighthouse-ci-report.report.html
            docs/test-results/lighthouse-ci-report.report.json
          retention-days: 14
